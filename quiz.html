<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>壓力快測・按壓減壓</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="quiz">
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="logo">🌸</span>按壓減壓<small>壓力快測</small></div>
    <span class="pill">試版 v0.1</span>
  </header>

  <main class="page">

    <div class="card hero">
      <div class="kicker">8 條問題・約 2 分鐘</div>
      <h1>壓力快測</h1>
      <p>回想<b>過去一個月</b>嘅感受，揀最接近你嘅情況。快測參考感知壓力量表（PSS）概念設計，只供自我體驗。</p>
    </div>

    <div class="card" id="quizBox"></div>

    <div class="card" id="resultBox" style="display:none;">
      <div class="result">
        <div class="emo">🌸</div>
        <div class="lvl" id="resLvl"></div>
        <div class="score" id="resScore"></div>
        <div id="resMsg"></div>
        <div class="cta-row" style="margin-top:16px;">
          <a class="btn btn-primary" href="program.html">開始 4 週課程</a>
          <a class="btn btn-ghost" href="acupoints.html">睇穴位教學</a>
        </div>
      </div>
    </div>

    <div class="card notice">
      <p>⚠️ 快測只供概念體驗，並非臨床診斷工具。如持續感到困擾，請尋求專業支援。</p>
    </div>

  </main>

  <nav class="tabbar">
    <a class="tab" data-tab="home" href="index.html"><span class="ico">🏠</span>首頁</a>
    <a class="tab" data-tab="program" href="program.html"><span class="ico">📅</span>課程</a>
    <a class="tab" data-tab="points" href="acupoints.html"><span class="ico">💆‍♀️</span>穴位</a>
    <a class="tab" data-tab="quiz" href="quiz.html"><span class="ico">🧘</span>快測</a>
    <a class="tab" data-tab="research" href="research.html"><span class="ico">📚</span>研究</a>
  </nav>

</div>

<script>
var QUESTIONS = [
  { q:"覺得冇辦法控制生活中重要嘅事情？", r:false },
  { q:"覺得自己應付唔嚟要做嘅嘢？", r:false },
  { q:"感到緊張同壓力？", r:false },
  { q:"覺得事情順心、一切如意？", r:true },
  { q:"發現自己成日掛住諗未做完嘅嘢？", r:false },
  { q:"覺得積累咗好多冇辦法解決嘅問題？", r:false },
  { q:"感到煩躁或者忟憎？", r:false },
  { q:"覺得自己處理得幾好？", r:true }
];
var OPTS = ["從未","間中","有時","經常","總是"];
var answers = {};
var started = false;

function render(){
  var box = document.getElementById('quizBox');
  var h = '<h3 style="margin-bottom:14px;">📝 過去一個月，你⋯⋯</h3>';
  QUESTIONS.forEach(function(item, i){
    h += '<div class="q"><label>' + (i+1) + '. ' + item.q + '</label><div class="opts">';
    OPTS.forEach(function(o, v){
      var sel = (answers[i] === v) ? ' sel' : '';
      h += '<div class="opt' + sel + '" data-q="' + i + '" data-v="' + v + '">' + o + '</div>';
    });
    h += '</div></div>';
  });
  h += '<div style="text-align:center;margin-top:6px;"><button class="btn btn-primary" id="submitBtn" style="border:none;width:100%;cursor:pointer;">睇我嘅壓力結果</button></div>';
  box.innerHTML = h;

  box.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){
      var q = el.getAttribute('data-q');
      answers[q] = parseInt(el.getAttribute('data-v'), 10);
      box.querySelectorAll('.opt[data-q="' + q + '"]').forEach(function(x){ x.classList.remove('sel'); });
      el.classList.add('sel');
      started = true;
    });
  });
  document.getElementById('submitBtn').addEventListener('click', submit);
}

function submit(){
  if (!started || Object.keys(answers).length < QUESTIONS.length){
    alert('仲未答晒 8 條問題呀～ 揀晒先出到結果 😊');
    return;
  }
  var total = 0;
  QUESTIONS.forEach(function(item, i){
    var v = answers[i];
    total += item.r ? (4 - v) : v;
  });
  var lvl, emo, msg;
  if (total <= 8){
    lvl = '壓力水平偏低'; emo = '🌿';
    msg = '狀態幾好！繼續保持每日 5 分鐘自我照顧，穴位按壓可以幫你維持呢個狀態。';
  } else if (total <= 16){
    lvl = '中等壓力'; emo = '🌤️';
    msg = '有啲壓力係正常，但要記得留時間俾自己。跟住 4 週課程每日按壓，幫你慢慢放鬆。';
  } else {
    lvl = '壓力偏高'; emo = '🌧️';
    msg = '辛苦喇！建議每日跟住課程做穴位按壓，同時同信任嘅人傾訴；如果持續困擾，記得尋求專業支援。';
  }
  document.getElementById('quizBox').style.display = 'none';
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resEmo') && (document.getElementById('resEmo').textContent = emo);
  document.querySelector('#resultBox .emo').textContent = emo;
  document.getElementById('resLvl').textContent = lvl;
  document.getElementById('resScore').textContent = total + ' / 32';
  document.getElementById('resMsg').innerHTML = '<p>' + msg + '</p>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
