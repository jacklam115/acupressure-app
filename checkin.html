<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記錄・照顧者自我穴位按壓計劃</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body data-page="checkin">
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="logo">🌸</span><span data-i18n="appTitle">照顧者自我穴位按壓計劃</span></div>
    <span class="pill" data-i18n="version">v0.8</span>
  </header>

  <main class="page">

    <div class="hero" style="padding:12px 14px;">
      <div class="kicker" id="heroMsg"></div>
      <h1 style="font-size:17px;margin-top:2px;" data-i18n="heroCheckinSub">每一次練習與記錄，都是旅程中重要的一步。</h1>
    </div>

    <!-- 今日按壓記錄 -->
    <div class="ci-block" id="acupBlock">
      <h3 data-i18n="acupressureRecord">今日按壓記錄</h3>
      <p class="sub" data-i18n="acupressureRecordSub">每日可按壓兩次，完成後點擊穴位圖即可標記</p>
      <div class="session-tick" id="sessionTabs"></div>
      <div class="point-grid" id="acupGrid"></div>
      <div style="margin-top:10px;">
        <button class="btn btn-primary" id="saveAcupBtn" style="width:100%;"><span data-i18n="saveAcupBtn">儲存按壓記錄</span></button>
      </div>
    </div>

    <!-- 睡前記錄（心情＋壓力＋不適） -->
    <div class="ci-block" id="nightBlock">
      <h3 data-i18n="nightBlock">今日睡前記錄</h3>
      <p class="sub" data-i18n="nightBlockSub">完成第二次按壓後填寫（心情、壓力、任何不適）</p>

      <p style="font-size:12.5px;font-weight:700;margin-bottom:6px;" data-i18n="moodTitle">今日心情</p>
      <div class="mood-row" id="moodRow">
        <button class="mood-btn" data-mood="sad"><span class="e">☹️</span><span class="l" data-i18n="moodSad">低落</span></button>
        <button class="mood-btn" data-mood="okay"><span class="e">😐</span><span class="l" data-i18n="moodOkay">一般</span></button>
        <button class="mood-btn" data-mood="happy"><span class="e">😄</span><span class="l" data-i18n="moodHappy">開心</span></button>
      </div>

      <p style="font-size:12.5px;font-weight:700;margin:12px 0 6px;" data-i18n="stressTitle">今日壓力記錄</p>
      <p style="font-size:11px;color:var(--muted);margin-bottom:8px;" data-i18n="stressQ">今天，你覺得……</p>
      <div id="pssBox"></div>
      <p style="font-size:12.5px;font-weight:700;margin:10px 0 6px;"><span data-i18n="stressSlider">今日整體壓力</span>：<b id="sliderVal" style="color:var(--accent-deep)">5</b></p>
      <input type="range" min="0" max="10" value="5" class="ci-slider" id="stressSlider">
      <div class="ci-slider-row"><span data-i18n="slider0">完全放鬆</span><span>5</span><span data-i18n="slider10">壓力最大</span></div>

      <p style="font-size:12.5px;font-weight:700;margin:12px 0 6px;" data-i18n="adverseTitle">今日穴位按壓後有否任何不適或不良反應？</p>
      <div class="ci-opts" style="max-width:280px;" id="adverseMC">
        <div class="ci-opt" data-v="no" style="flex:1;"><span data-i18n="adverseNo">沒有</span></div>
        <div class="ci-opt" data-v="yes" style="flex:1;"><span data-i18n="adverseYes">有</span></div>
      </div>
      <textarea class="ci-text" id="adverseBox" style="display:none;margin-top:8px;" data-i18n-ph="adversePlaceholder"></textarea>

      <div style="margin-top:12px;">
        <button class="btn btn-primary" id="saveNightBtn" style="width:100%;"><span data-i18n="saveNightBtn">儲存睡前記錄</span></button>
      </div>
    </div>

    <div id="savedMsg" style="display:none;text-align:center;color:var(--ok);font-weight:800;margin:10px 0 14px;"></div>

  </main>

  <nav class="tabbar">
    <a class="tab" data-tab="home" href="index.html?v=9"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span data-i18n="tabHome">首頁</span></a>
    <a class="tab" data-tab="tutorial" href="tutorial.html?v=9"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg><span data-i18n="tabTutorial">教學</span></a>
    <a class="tab" data-tab="checkin" href="checkin.html?v=9"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg><span data-i18n="tabCheckin">記錄</span></a>
    <a class="tab" data-tab="research" href="research.html?v=9"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1"/></svg><span data-i18n="tabResearch">資料</span></a>
  </nav>

</div>
<script src="config.js?v=9"></script>
<script src="app.js?v=9"></script>
<script>
var POINTS = [
  { slug:'baihui', zh:'百會', en:'GV20' }, { slug:'fengchi', zh:'風池', en:'GB20' }, { slug:'hegu', zh:'合谷', en:'LI4' },
  { slug:'shenshu', zh:'腎俞', en:'UB23' }, { slug:'zhongwan', zh:'中脘', en:'CV12' }, { slug:'qihai', zh:'氣海', en:'CV6' },
  { slug:'guanyuan', zh:'關元', en:'CV4' }, { slug:'zusanli', zh:'足三里', en:'ST36' }, { slug:'yongquan', zh:'涌泉', en:'KD1' }
];
window.ACUP_SVG = {
  baihui: '<svg viewBox="0 0 100 75"><ellipse cx="50" cy="38" rx="36" ry="31" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="50" cy="28" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  fengchi: '<svg viewBox="0 0 100 75"><circle cx="50" cy="22" r="17" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><path d="M41 36 L38 66 Q37 70 42 70 L58 70 Q63 70 62 66 L59 36" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="44" cy="48" r="6" fill="#E8728A" stroke="#fff" stroke-width="2.5"/><circle cx="56" cy="48" r="6" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  hegu: '<svg viewBox="0 0 100 75"><path d="M30 66 Q23 50 27 37 Q29 29 37 28 L39 22 Q40 18 44 19 L45 26 L48 18 Q49 15 52 17 L51 26 L55 20 Q57 17 60 20 L57 28 L62 24 Q65 22 66 26 L61 32 Q75 35 76 46 Q77 58 70 66 Z" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="52" cy="43" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  shenshu: '<svg viewBox="0 0 100 75"><path d="M35 10 Q35 4 42 4 L58 4 Q65 4 65 10 L64 64 Q64 69 50 69 Q36 69 36 64 Z" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="40" cy="48" r="6.5" fill="#E8728A" stroke="#fff" stroke-width="2.5"/><circle cx="60" cy="48" r="6.5" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  zhongwan: '<svg viewBox="0 0 100 75"><ellipse cx="50" cy="40" rx="31" ry="29" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="50" cy="49" r="3.5" fill="#E8B8C4"/><circle cx="50" cy="26" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  qihai: '<svg viewBox="0 0 100 75"><ellipse cx="50" cy="40" rx="31" ry="29" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="50" cy="49" r="3.5" fill="#E8B8C4"/><circle cx="50" cy="58" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  guanyuan: '<svg viewBox="0 0 100 75"><ellipse cx="50" cy="40" rx="31" ry="29" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="50" cy="49" r="3.5" fill="#E8B8C4"/><circle cx="50" cy="64" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  zusanli: '<svg viewBox="0 0 100 75"><path d="M44 4 L56 4 L59 35 Q65 42 64 50 L63 69 Q63 72 59 72 L41 72 Q37 72 37 69 L36 50 Q35 42 41 35 Z" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="50" cy="25" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>',
  yongquan: '<svg viewBox="0 0 100 75"><path d="M26 48 Q20 35 33 26 Q55 15 70 22 Q84 29 83 42 Q82 56 69 59 Q55 62 43 58 Q30 54 26 48 Z" fill="#FBEFF2" stroke="#E8B8C4" stroke-width="2.5"/><circle cx="56" cy="36" r="8" fill="#E8728A" stroke="#fff" stroke-width="2.5"/></svg>'
};
var PSS = [
  { zh:'覺得無法控制生活中重要的事情？', en:'You felt unable to control the important things in your life?', rev:false },
  { zh:'對自己處理個人問題有信心？', en:'You felt confident about handling your personal problems?', rev:true },
  { zh:'覺得事情順心、一切如意？', en:'You felt that things were going your way?', rev:true },
  { zh:'覺得困難多到應付不來？', en:'You felt difficulties were piling up so high you could not overcome them?', rev:false }
];
var cur = { session: 0, acup: [[], []], mood: null, pss: {}, slider: 5, adverseYes: null, adverse: '', savedAcup: [false, false], nightSaved: false };

function renderHero() { document.getElementById('heroMsg').textContent = APP.pickMsg('heroCheckin'); }

function load() {
  var rec = APP.getToday();
  cur.acup = rec.acup && rec.acup.length === 2 ? rec.acup.map(function(a){return a.slice();}) : [[], []];
  cur.savedAcup = [cur.acup[0].length > 0, cur.acup[1].length > 0];
  cur.mood = rec.mood || null;
  cur.pss = rec.pss || {};
  cur.slider = rec.slider !== null && rec.slider !== undefined ? rec.slider : 5;
  cur.adverseYes = rec.adverseYes === true ? true : (rec.adverse ? true : null);
  cur.adverse = rec.adverse || '';
  cur.nightSaved = !!(rec.mood || (rec.pss && Object.keys(rec.pss).length) || (rec.score !== null && rec.score !== undefined));
  if (!cur.savedAcup[0] && cur.session !== 0) cur.session = 0;
}

function renderSessionTabs() {
  var labels = [APP.t('sessionMorning'), APP.t('sessionEvening')];
  document.getElementById('sessionTabs').innerHTML = labels.map(function (l, i) {
    var done = cur.savedAcup[i];
    return '<button class="st-btn' + (cur.session === i ? ' on' : '') + '" data-s="' + i + '" style="' + (done ? 'border-color:var(--ok);color:var(--ok);' : '') + '">' + l + (done ? ' ✓' : '') + '</button>';
  }).join('');
  document.getElementById('sessionTabs').querySelectorAll('.st-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      if (cur.savedAcup[parseInt(b.getAttribute('data-s'), 10)]) return;
      cur.session = parseInt(b.getAttribute('data-s'), 10);
      renderSessionTabs(); renderAcupGrid();
    });
  });
}

function imgHtml(p) {
  return '<img src="' + APP.photoURL(p.slug) + '" alt="' + p.zh + '" data-slug="' + p.slug + '" loading="lazy" onerror="APP.imgFallback(this)">';
}

function renderAcupGrid() {
  var idx = cur.session;
  var done = cur.savedAcup[idx];
  var en = APP.lang === 'en';
  var h = '';
  POINTS.forEach(function (p, i) {
    var on = cur.acup[idx].indexOf(i) >= 0;
    var main = en ? p.en : p.zh;
    var sub = en ? p.zh : p.en;
    h += '<div class="point-card' + (on ? ' on' : '') + '" data-p="' + i + '">'
      + '<div class="pc-img">' + imgHtml(p) + '<span class="pc-tick">' + (on ? '✓' : '') + '</span></div>'
      + '<div class="pc-name">' + main + '<small>' + sub + '</small></div></div>';
  });
  document.getElementById('acupGrid').innerHTML = h;
  document.getElementById('acupGrid').querySelectorAll('.point-card').forEach(function (el) {
    el.addEventListener('click', function () {
      if (done) return;
      var i = parseInt(el.getAttribute('data-p'), 10);
      var a = cur.acup[idx];
      var pos = a.indexOf(i);
      if (pos >= 0) a.splice(pos, 1); else a.push(i);
      // no full re-render -> no page blink
      el.classList.toggle('on', a.indexOf(i) >= 0);
      el.querySelector('.pc-tick').textContent = a.indexOf(i) >= 0 ? '✓' : '';
    });
  });
}

function renderPSS() {
  var OPTS = APP.t('pssOpts');
  var el = document.getElementById('pssBox');
  var h = '';
  PSS.forEach(function (item, i) {
    h += '<div class="ci-q"><label>' + (i + 1) + '. ' + (APP.lang === 'en' ? item.en : item.zh) + '</label><div class="ci-opts">';
    OPTS.forEach(function (o, v) {
      h += '<div class="ci-opt' + (cur.pss[i] === v ? ' sel' : '') + '" data-q="' + i + '" data-v="' + v + '">' + o + '</div>';
    });
    h += '</div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.ci-opt').forEach(function (el2) {
    el2.addEventListener('click', function () {
      cur.pss[el2.getAttribute('data-q')] = parseInt(el2.getAttribute('data-v'), 10);
      el.querySelectorAll('.ci-opt[data-q="' + el2.getAttribute('data-q') + '"]').forEach(function (x) { x.classList.remove('sel'); });
      el2.classList.add('sel');
    });
  });
}

function renderMood() {
  document.querySelectorAll('.mood-btn').forEach(function (b) {
    b.classList.toggle('sel', cur.mood === b.getAttribute('data-mood'));
  });
}

function renderAdverse() {
  document.querySelectorAll('#adverseMC .ci-opt').forEach(function (el2) {
    el2.classList.toggle('sel', (el2.getAttribute('data-v') === 'yes') === (cur.adverseYes === true));
  });
  document.getElementById('adverseBox').style.display = cur.adverseYes === true ? 'block' : 'none';
  document.getElementById('adverseBox').value = cur.adverse;
}

function lockBlock(id, msg, withReset) {
  var el = document.getElementById(id);
  el.classList.add('locked');
  var m = document.createElement('div');
  m.className = 'lock-msg';
  m.innerHTML = '✓ ' + msg;
  if (withReset) {
    var r = document.createElement('button');
    r.className = 'lock-reset';
    r.textContent = APP.t('resetToday');
    r.addEventListener('click', function () {
      if (r.getAttribute('data-arm') === '1') {
        var rec = APP.getToday();
        delete rec.mood; delete rec.pss; delete rec.slider; delete rec.score; delete rec.adverse; delete rec.adverseYes;
        APP.setToday(rec);
        load(); renderSessionTabs(); renderAcupGrid(); renderPSS(); renderMood(); renderAdverse(); applyLock();
        APP.syncRecords();   // push the cleared state to the server too
      } else {
        r.setAttribute('data-arm', '1');
        r.textContent = APP.t('resetConfirm');
        setTimeout(function () { r.setAttribute('data-arm', '0'); r.textContent = APP.t('resetToday'); }, 4000);
      }
    });
    m.appendChild(r);
  }
  el.appendChild(m);
}

function applyLock() {
  ['acupBlock', 'nightBlock'].forEach(function (id) {
    var el = document.getElementById(id);
    el.classList.remove('locked');
    var old = el.querySelector('.lock-msg'); if (old) old.remove();
  });
  if (cur.savedAcup[0] && cur.savedAcup[1]) lockBlock('acupBlock', APP.t('doneAcup'));
  if (cur.nightSaved) lockBlock('nightBlock', APP.t('doneToday'), true);
}

function afterSave() {
  renderSessionTabs(); renderAcupGrid(); applyLock();
  APP.syncRecords().then(function (ok) {
    showSaved(ok === null ? APP.t('savedMsg') : ok ? APP.t('syncOk') : APP.t('syncFail'));
  });
}

function saveAcup() {
  if (cur.acup[cur.session].length === 0) { alert(APP.t('fillAll')); return; }
  APP.setToday({ acup: cur.acup });
  cur.savedAcup[cur.session] = true;
  afterSave();
  // auto-jump to the second session when the first is done
  if (cur.session === 0 && !cur.savedAcup[1]) {
    cur.session = 1;
    renderSessionTabs(); renderAcupGrid();
  }
}

function saveNight() {
  if (!cur.mood) { alert(APP.t('fillAll')); return; }
  if (Object.keys(cur.pss).length < PSS.length) { alert(APP.t('fillAll')); return; }
  var total = 0;
  PSS.forEach(function (item, i) { total += item.rev ? (4 - cur.pss[i]) : cur.pss[i]; });
  var adverseTxt = cur.adverseYes === true ? document.getElementById('adverseBox').value.trim() : '';
  APP.setToday({ mood: cur.mood, pss: cur.pss, slider: parseInt(document.getElementById('stressSlider').value, 10), score: total, adverseYes: cur.adverseYes, adverse: adverseTxt });
  cur.nightSaved = true;
  afterSave();
}

function showSaved(msg) {
  var el = document.getElementById('savedMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function () { el.style.display = 'none'; }, 2600);
}

document.addEventListener('DOMContentLoaded', function () {
  renderHero();
  load();
  renderSessionTabs(); renderAcupGrid(); renderPSS(); renderMood(); renderAdverse(); applyLock();
  document.getElementById('stressSlider').value = cur.slider;
  document.getElementById('sliderVal').textContent = cur.slider;
  document.getElementById('stressSlider').addEventListener('input', function () {
    cur.slider = this.value;
    document.getElementById('sliderVal').textContent = this.value;
  });
  document.querySelectorAll('.mood-btn').forEach(function (b) {
    b.addEventListener('click', function () { cur.mood = b.getAttribute('data-mood'); renderMood(); });
  });
  document.querySelectorAll('#adverseMC .ci-opt').forEach(function (el2) {
    el2.addEventListener('click', function () {
      cur.adverseYes = el2.getAttribute('data-v') === 'yes';
      renderAdverse();
    });
  });
  document.getElementById('saveAcupBtn').addEventListener('click', saveAcup);
  document.getElementById('saveNightBtn').addEventListener('click', saveNight);
  APP.fetchContent().then(function () { renderHero(); renderAcupGrid(); });
  // auto-sync to admin when logged in (silent; on load + after saves)
  var s0 = APP.session();
  if (s0 && s0.token) APP.syncRecords();
  window.pageI18n = function () { renderHero(); renderSessionTabs(); renderAcupGrid(); renderPSS(); renderAdverse(); applyLock(); };
  APP.imgWatchdog();
});
</script>
</body>
</html>
