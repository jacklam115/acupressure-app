<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記錄・照顧者自我穴位按壓計劃</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="checkin">
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="logo">🌸</span><span data-i18n="appTitle">照顧者自我穴位按壓計劃</span></div>
    <span class="pill" data-i18n="version">v0.1</span>
  </header>

  <main class="page">

    <div class="hero" id="checkinHero">
      <div class="kicker" id="heroMsg"></div>
      <h1 data-i18n="heroCheckinSub">每一次練習與記錄，都是旅程中重要的一步。</h1>
    </div>

    <!-- 今日按壓記錄 -->
    <div class="ci-block" id="acupBlock">
      <h3 data-i18n="acupressureRecord">今日按壓記錄</h3>
      <p class="sub" data-i18n="acupressureRecordSub">每日可按壓兩次（如上午、晚上），完成後逐項勾選</p>
      <div class="session-tick" id="sessionTabs"></div>
      <div id="acupList"></div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" id="saveAcupBtn" style="width:100%;"><span data-i18n="saveAcupBtn">儲存按壓記錄</span></button>
      </div>
    </div>

    <!-- 今日心情 -->
    <div class="ci-block" id="moodBlock">
      <h3 data-i18n="moodTitle">今日心情</h3>
      <p class="sub" data-i18n="moodSub">睡前（完成第二次按壓後）填寫</p>
      <div class="mood-row" id="moodRow">
        <button class="mood-btn" data-mood="happy"><span class="e">😄</span><span class="l" data-i18n="moodHappy">開心</span></button>
        <button class="mood-btn" data-mood="okay"><span class="e">😐</span><span class="l" data-i18n="moodOkay">一般</span></button>
        <button class="mood-btn" data-mood="sad"><span class="e">☹️</span><span class="l" data-i18n="moodSad">低落</span></button>
      </div>
    </div>

    <!-- 今日壓力記錄 -->
    <div class="ci-block" id="stressBlock">
      <h3 data-i18n="stressTitle">今日壓力記錄</h3>
      <p class="sub" data-i18n="stressSub">睡前填寫一次，回顧今天的感受</p>
      <p style="font-size:13px;font-weight:700;margin-bottom:10px;" data-i18n="stressQ">今天，你覺得……</p>
      <div id="pssBox"></div>
      <p style="font-size:13.5px;font-weight:700;margin:12px 0 6px;"><span data-i18n="stressSlider">今日整體壓力</span>：<b id="sliderVal" style="color:var(--accent-deep)">5</b></p>
      <input type="range" min="0" max="10" value="5" class="ci-slider" id="stressSlider">
      <div class="ci-slider-row"><span data-i18n="slider0">完全放鬆</span><span>5</span><span data-i18n="slider10">壓力最大</span></div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" id="saveNightBtn" style="width:100%;"><span data-i18n="saveNightBtn">儲存睡前記錄</span></button>
      </div>
    </div>

    <div id="savedMsg" style="display:none;text-align:center;color:var(--ok);font-weight:800;margin:10px 0 14px;"></div>

  </main>

  <nav class="tabbar">
    <a class="tab" data-tab="home" href="index.html"><span class="ico">🏠</span><span data-i18n="tabHome">首頁</span></a>
    <a class="tab" data-tab="tutorial" href="tutorial.html"><span class="ico">💆‍♀️</span><span data-i18n="tabTutorial">教學</span></a>
    <a class="tab" data-tab="checkin" href="checkin.html"><span class="ico">📝</span><span data-i18n="tabCheckin">記錄</span></a>
    <a class="tab" data-tab="research" href="research.html"><span class="ico">📚</span><span data-i18n="tabResearch">研究</span></a>
  </nav>

</div>
<script src="app.js"></script>
<script>
var POINTS = [
  { zh:'百會', en:'GV20' }, { zh:'風池', en:'GB20' }, { zh:'合谷', en:'LI4' },
  { zh:'腎俞', en:'UB23' }, { zh:'中脘', en:'CV12' }, { zh:'氣海', en:'CV6' },
  { zh:'關元', en:'CV4' }, { zh:'足三里', en:'ST36' }, { zh:'涌泉', en:'KD1' }
];
var PSS = [
  { zh:'覺得無法控制生活中重要的事情？', en:'You felt unable to control the important things in your life?', rev:false },
  { zh:'對自己處理個人問題有信心？', en:'You felt confident about handling your personal problems?', rev:true },
  { zh:'覺得事情順心、一切如意？', en:'You felt that things were going your way?', rev:true },
  { zh:'覺得困難多到應付不來？', en:'You felt difficulties were piling up so high you could not overcome them?', rev:false }
];
var OPTS = APP.t('pssOpts');
var cur = { session: 0, acup: [[], []], mood: null, pss: {}, slider: 5, savedAcup: [false, false], moodSaved: false, stressSaved: false };

function renderHero() {
  document.getElementById('heroMsg').textContent = APP.pick(APP.t('heroCheckin'));
}

function load() {
  var rec = APP.getToday();
  cur.acup = rec.acup && rec.acup.length === 2 ? rec.acup : [[], []];
  cur.savedAcup = [cur.acup[0].length > 0, cur.acup[1].length > 0];
  cur.mood = rec.mood || null;
  cur.pss = rec.pss || {};
  cur.slider = rec.slider !== null && rec.slider !== undefined ? rec.slider : 5;
  cur.moodSaved = !!rec.mood;
  cur.stressSaved = (rec.pss && Object.keys(rec.pss).length === PSS.length) || (rec.score !== null && rec.score !== undefined);
}

function renderSessionTabs() {
  var el = document.getElementById('sessionTabs');
  var labels = [APP.t('sessionMorning'), APP.t('sessionEvening')];
  el.innerHTML = labels.map(function (l, i) {
    var done = cur.savedAcup[i];
    return '<button class="st-btn' + (cur.session === i ? ' on' : '') + (done ? '" style="border-color:var(--ok);color:var(--ok);"' : '"') + ' data-s="' + i + '">' + l + (done ? ' ✓' : '') + '</button>';
  }).join('');
  el.querySelectorAll('.st-btn').forEach(function (b) {
    b.addEventListener('click', function () { cur.session = parseInt(b.getAttribute('data-s'), 10); renderSessionTabs(); renderAcupList(); });
  });
}

function renderAcupList() {
  var el = document.getElementById('acupList');
  var idx = cur.session;
  var done = cur.savedAcup[idx];
  var h = '';
  POINTS.forEach(function (p, i) {
    var checked = cur.acup[idx].indexOf(i) >= 0;
    h += '<label class="point-check"><input type="checkbox" data-p="' + i + '"' + (checked ? ' checked' : '') + (done ? ' disabled' : '') + '>'
      + '<span><b>' + p.zh + ' <span style="color:var(--muted);font-size:11px;">' + p.en + '</span></b>'
      + '<span>' + (done ? '✓' : '') + '</span></span></label>';
  });
  el.innerHTML = h;
  el.querySelectorAll('input').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var i = parseInt(inp.getAttribute('data-p'), 10);
      var a = cur.acup[idx];
      if (inp.checked) { if (a.indexOf(i) < 0) a.push(i); } else { a = a.filter(function (x) { return x !== i; }); cur.acup[idx] = a; }
    });
  });
}

function renderPSS() {
  var el = document.getElementById('pssBox');
  var h = '';
  PSS.forEach(function (item, i) {
    h += '<div class="ci-q"><label>' + (i + 1) + '. ' + (APP.lang === 'en' ? item.en : item.zh) + '</label><div class="ci-opts">';
    OPTS.forEach(function (o, v) {
      var sel = cur.pss[i] === v ? ' sel' : '';
      h += '<div class="ci-opt' + sel + '" data-q="' + i + '" data-v="' + v + '">' + o + '</div>';
    });
    h += '</div></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.ci-opt').forEach(function (el2) {
    el2.addEventListener('click', function () {
      cur.pss[el2.getAttribute('data-q')] = parseInt(el2.getAttribute('data-v'), 10);
      el.querySelectorAll('.ci-opt[data-q="' + el2.getAttribute('data-q') + '"]').forEach(function (x) { x.classList.remove('sel'); });
      el2.classList.add('sel');
    });
  });
}

function renderMood() {
  document.querySelectorAll('.mood-btn').forEach(function (b) {
    b.classList.toggle('sel', cur.mood === b.getAttribute('data-mood'));
  });
}

function lockBlock(id, msg) {
  var el = document.getElementById(id);
  el.classList.add('locked');
  var m = document.createElement('div');
  m.className = 'lock-msg';
  m.textContent = msg;
  el.appendChild(m);
}

function applyLock() {
  var L = function (id) { var el = document.getElementById(id); if (el) el.classList.remove('locked'); };
  ['acupBlock', 'moodBlock', 'stressBlock'].forEach(function (id) {
    var el = document.getElementById(id);
    el.classList.remove('locked');
    var old = el.querySelector('.lock-msg'); if (old) old.remove();
  });
  if (cur.savedAcup[0] && cur.savedAcup[1]) lockBlock('acupBlock', APP.t('doneAcup'));
  if (cur.moodSaved) lockBlock('moodBlock', APP.t('doneToday'));
  if (cur.stressSaved) lockBlock('stressBlock', APP.t('doneToday'));
}

function saveAcup() {
  var idx = cur.session;
  if (cur.acup[idx].length === 0) { alert(APP.t('fillAll')); return; }
  APP.setToday({ acup: cur.acup });
  cur.savedAcup[idx] = true;
  showSaved(APP.t('savedMsg'));
  renderSessionTabs(); renderAcupList(); applyLock();
}

function saveNight() {
  if (!cur.mood) { alert(APP.t('fillAll')); return; }
  if (Object.keys(cur.pss).length < PSS.length) { alert(APP.t('fillAll')); return; }
  var total = 0;
  PSS.forEach(function (item, i) { total += item.rev ? (4 - cur.pss[i]) : cur.pss[i]; });
  APP.setToday({ mood: cur.mood, pss: cur.pss, slider: parseInt(document.getElementById('stressSlider').value, 10), score: total });
  cur.moodSaved = true; cur.stressSaved = true;
  showSaved(APP.t('savedMsg') + ' (' + total + '/16)');
  applyLock();
}

function showSaved(msg) {
  var el = document.getElementById('savedMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function () { el.style.display = 'none'; }, 2500);
}

document.addEventListener('DOMContentLoaded', function () {
  OPTS = APP.t('pssOpts');
  renderHero();
  load();
  renderSessionTabs(); renderAcupList(); renderPSS(); renderMood(); applyLock();
  document.getElementById('stressSlider').value = cur.slider;
  document.getElementById('sliderVal').textContent = cur.slider;
  document.getElementById('stressSlider').addEventListener('input', function () {
    cur.slider = this.value;
    document.getElementById('sliderVal').textContent = this.value;
  });
  document.querySelectorAll('.mood-btn').forEach(function (b) {
    b.addEventListener('click', function () { cur.mood = b.getAttribute('data-mood'); renderMood(); });
  });
  document.getElementById('saveAcupBtn').addEventListener('click', saveAcup);
  document.getElementById('saveNightBtn').addEventListener('click', saveNight);
  window.pageI18n = function () { OPTS = APP.t('pssOpts'); renderHero(); renderSessionTabs(); renderAcupList(); renderPSS(); applyLock(); };
});
</script>
</body>
</html>
